<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Startkort - Gloppen-metoden</title>
  <link rel="stylesheet" href="startcard.css">
</head>
<body>
  <div id="startcard-preview"></div>
  <script type="module">
    import { startcardTemplate } from './startcard-template.js';
    import { fitTextInRoundsTableCells } from './fitTextInCell.js';
    const card = startcardTemplate();
    document.body.appendChild(card);
    fitTextInRoundsTableCells(card);
    // Also refit after rendering, in case of async content
    setTimeout(() => fitTextInRoundsTableCells(card), 100);
  </script>
</body>
</html>
