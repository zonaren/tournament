<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnering</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="css/general.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/match-setup.css">
  <link rel="stylesheet" href="css/tournament-overview.css">
  <link rel="stylesheet" href="css/match-overview.css">
  <link rel="stylesheet" href="css/player-overview.css">
  <link rel="stylesheet" href="css/context-menu.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/popup.css">
  <link rel="stylesheet" href="css/number-pad.css">
</head>
<body>
  <script type="module" src="UI-popup.js"></script>
  <script type="module" src="events.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
      .then(registration => {
        console.log('Service Worker registrert!', registration);
        
        // Handle service worker updates
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('New service worker available! Please refresh the page.');
              // Optionally show a toast or notification to the user
              if (confirm('En ny versjon av appen er tilgjengelig. Vil du laste den nå?')) {
                newWorker.postMessage({ type: 'SKIP_WAITING' });
                window.location.reload();
              }
            }
          });
        });
        
        // Listen for messages from service worker
        navigator.serviceWorker.addEventListener('message', event => {
          console.log('Message from service worker:', event.data);
        });
      })
      .catch(err => console.error('Service Worker-feil:', err));
    }
  </script>

</body>
</html>
