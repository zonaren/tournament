<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generer kastnøkler</title>
  <style>
    h1,h2,h3 {
      text-align: center;
    }
        table{
        width: 100%;
        border-collapse: collapse;
    }
    table, th, td {
        border: 1px solid black;
        

    }
    th, td {
        padding: 1px;
        text-align: center;
    }
    /* Alternate row colors */
    tr:nth-child(even) {
            background-color: lightgray;
        }

        tr:nth-child(odd) {
            background-color: #ffffff;
        }
    #tournamentSchedule{
      margin: 0 auto;
      margin-top: 5px;
    }
    @media print {
    .no-print {
      display: none !important;
    }
    table{
      width: 100%;
    }
  }
  .print-btn {
    float: right;
  }
  #tournamentDetails {
        display: flex;
        justify-content: space-between;
    }
    #matchOverview {
        width: 50%;
    }
    #playerOverview {
        width: 40%;
    }
    .hidden {
        display: none;
    }
</style>
</head>
<body>
  <div id="headerMenu">
  <h2 id="titleText"></h2>
    <div id="menu-buttons" class="no-print">
      <select id="gametypeSelect"></select>
      <select id="playerCountSelect"></select>
      <select id="roundCountSelect"></select>
      <button id="save-btn">Lagre</button>
      <button id="start-btn" class="hidden">Start turnering</button>
      <button id="printContent" class="print-btn">Skriv ut</button>
      
    </div>

  <div id="matchSetup"></div>
  <div id="tournamentOverview">
    <div id="tournamentInfo"></div>
    <div id="tournamentDetails">
      <div id="matchOverview"></div>
      <div id="playerOverview"></div>
    </div>

  </div>
  
</div>
  
  <script src="dataset.js"></script>
  <script src="kampoppsett.js"></script>
  <script src="generateMatches.js"></script>
  <script src="UI.js"></script>
  <script src="generateSelectList.js"></script>
  <script src="events.js"></script>

  
  
</body>
</html>
